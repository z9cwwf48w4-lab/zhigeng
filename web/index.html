<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知更</title>
<meta name="theme-color" content="#131110">
<link rel="stylesheet" href="/css/app.css?v=11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d9a441'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23131110'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <!-- 左侧 rail：知更的身份 + 导航 -->
  <nav class="rail" id="rail">
    <div class="rail-logo" title="知更">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="var(--gold)"/>
        <circle cx="20" cy="12" r="2.4" fill="var(--bg)"/>
        <path d="M14 16 L26 14" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="rail-nav" id="rail-nav"></div>
    <div class="rail-foot">
      <span class="rail-dot" id="rail-dot"></span>
      <span class="rail-foot-txt" id="rail-foot-txt">…</span>
    </div>
  </nav>

  <!-- 主区 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-id">
        <span class="topbar-avatar">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="var(--gold)"/>
            <circle cx="20" cy="12" r="2.4" fill="var(--bg)"/>
            <path d="M14 16 L26 14" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="topbar-id-txt">
          <strong>知更</strong>
          <span id="mood-line">…</span>
        </div>
      </div>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast-wrap" id="toast"></div>
<script type="module" src="/js/main.js?v=11"></script>
</body>
</html>
